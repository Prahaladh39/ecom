{% extends "base.html" %}

{% block title %}Student Registration | SchoolMart{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 480px; margin: 3rem auto 4.5rem; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.25rem; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div class="user-avatar-circle" style="width: 48px; height: 48px; margin: 0 auto 0.75rem; font-size: 1.3rem;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 style="font-size: 1.65rem; margin-bottom: 0.35rem;">Student Sign Up</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Create your student account to buy and sell school items.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name <span class="req">*</span></label>
                <input type="text" id="full_name" name="full_name" class="form-input" 
                       placeholder="e.g. Rahul Sharma" required autofocus>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="student_class" class="form-label">Class & Stream</label>
                    <input type="text" id="student_class" name="student_class" class="form-input" 
                           placeholder="e.g. Class 12 - Science">
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">WhatsApp Number <span class="req">*</span></label>
                    <input type="tel" id="phone" name="phone" class="form-input" 
                           placeholder="e.g. 9876543210" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address <span class="req">*</span></label>
                <input type="email" id="email" name="email" class="form-input" 
                       placeholder="e.g. rahul@school.edu" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password" class="form-label">Password <span class="req">*</span></label>
                    <input type="password" id="password" name="password" class="form-input" 
                           placeholder="At least 4 chars" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm <span class="req">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" 
                           placeholder="Re-type password" required>
                </div>
            </div>

            <button type="submit" class="btn-sell-product" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.95rem;" id="register-submit-btn">
                <i class="bi bi-person-check-fill"></i> Create Student Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700;">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
